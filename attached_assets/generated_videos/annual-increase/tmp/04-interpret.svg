  <text x="80" y="34" font-family="DejaVu Sans,Arial" font-size="14" font-weight="700" fill="#43d0c0" text-anchor="start">03  /  INTERPRET</text>
  <text x="270" y="38" font-family="DejaVu Sans,Arial" font-size="25" font-weight="500" fill="#f5f7f6" text-anchor="start">Understand the result</text>
  <text x="1198" y="35" font-family="DejaVu Sans,Arial" font-size="12" font-weight="500" fill="#9aadb2" text-anchor="end">VARIANCE  •  TURNOVER  •  REVENUE</text>
      <rect x="80" y="70" width="1120" height="610" fill="#f7f9f9"/>
      <text x="112" y="110" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" fill="#183446" text-anchor="start">Why the quarterly result differs from the target</text>
      <text x="112" y="136" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400" fill="#667b85" text-anchor="start">The bridge separates embedded growth from the actions being planned now.</text>
      <rect x="112" y="164" width="510" height="92" rx="10" fill="#fff" stroke="#dbe4e7"/>
      <text x="134" y="192" font-family="DejaVu Sans,Arial" font-size="11" font-weight="700" fill="#667b85" text-anchor="start">Prior-year realized rate</text>
      <text x="134" y="226" font-family="DejaVu Sans,Arial" font-size="24" font-weight="700" fill="#183446" text-anchor="start">$4,512</text>
      <text x="250" y="225" font-family="DejaVu Sans,Arial" font-size="11" font-weight="500" fill="#667b85" text-anchor="start">The matched-quarter baseline</text><rect x="640" y="164" width="510" height="92" rx="10" fill="#fff" stroke="#dbe4e7"/>
      <text x="662" y="192" font-family="DejaVu Sans,Arial" font-size="11" font-weight="700" fill="#667b85" text-anchor="start">Growth already embedded</text>
      <text x="662" y="226" font-family="DejaVu Sans,Arial" font-size="24" font-weight="700" fill="#183446" text-anchor="start">+2.1%</text>
      <text x="778" y="225" font-family="DejaVu Sans,Arial" font-size="11" font-weight="500" fill="#667b85" text-anchor="start">Earlier pricing and resident mix</text><rect x="112" y="276" width="510" height="92" rx="10" fill="#fff" stroke="#dbe4e7"/>
      <text x="134" y="304" font-family="DejaVu Sans,Arial" font-size="11" font-weight="700" fill="#667b85" text-anchor="start">Current Street variance</text>
      <text x="134" y="338" font-family="DejaVu Sans,Arial" font-size="24" font-weight="700" fill="#183446" text-anchor="start">−7.4%</text>
      <text x="250" y="337" font-family="DejaVu Sans,Arial" font-size="11" font-weight="500" fill="#667b85" text-anchor="start">In-house remains below Street</text><rect x="640" y="276" width="510" height="92" rx="10" fill="#edf9f7" stroke="#dbe4e7"/>
      <text x="662" y="304" font-family="DejaVu Sans,Arial" font-size="11" font-weight="700" fill="#667b85" text-anchor="start">Turnover into new Street Rates</text>
      <text x="662" y="338" font-family="DejaVu Sans,Arial" font-size="24" font-weight="700" fill="#087f78" text-anchor="start">+1.2%</text>
      <text x="778" y="337" font-family="DejaVu Sans,Arial" font-size="11" font-weight="500" fill="#667b85" text-anchor="start">32% annual turnover replaces residents</text>
      <rect x="112" y="408" width="1056" height="184" rx="10" fill="#fff" stroke="#dbe4e7"/>
      <text x="136" y="441" font-family="DejaVu Sans,Arial" font-size="14" font-weight="700" fill="#183446" text-anchor="start">Projected quarterly YoY growth</text>
      <rect x="136" y="466" width="220" height="76" rx="10" fill="#fff8e8" stroke="#dbe4e7"/>
        <text x="246" y="499" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="#946c16" text-anchor="middle">Q1  6.0%</text>
        <text x="246" y="524" font-family="DejaVu Sans,Arial" font-size="10" font-weight="600" fill="#667b85" text-anchor="middle">Binding quarter</text><rect x="380" y="466" width="220" height="76" rx="10" fill="#f4f8f8" stroke="#dbe4e7"/>
        <text x="490" y="499" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="#087f78" text-anchor="middle">Q2  6.2%</text>
        <text x="490" y="524" font-family="DejaVu Sans,Arial" font-size="10" font-weight="600" fill="#667b85" text-anchor="middle">Meets target</text><rect x="624" y="466" width="220" height="76" rx="10" fill="#f4f8f8" stroke="#dbe4e7"/>
        <text x="734" y="499" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="#087f78" text-anchor="middle">Q3  6.4%</text>
        <text x="734" y="524" font-family="DejaVu Sans,Arial" font-size="10" font-weight="600" fill="#667b85" text-anchor="middle">Meets target</text><rect x="868" y="466" width="220" height="76" rx="10" fill="#f4f8f8" stroke="#dbe4e7"/>
        <text x="978" y="499" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="#087f78" text-anchor="middle">Q4  6.3%</text>
        <text x="978" y="524" font-family="DejaVu Sans,Arial" font-size="10" font-weight="600" fill="#667b85" text-anchor="middle">Meets target</text>
      <text x="136" y="574" font-family="DejaVu Sans,Arial" font-size="11" font-weight="600" fill="#536a74" text-anchor="start">Interpretation: current pricing, new increases, and turnover reconcile to the same forecast.</text>
    <rect x="80" y="70" width="1120" height="610" rx="4" fill="none" stroke="#ffffff" opacity=".7"/></svg>