# nginx config for the `web` container.
# - Serves the React SPA from /usr/share/nginx/html
# - Proxies /api/*, /attached_assets/*, /uploads/* to the api container
#   (which is internal-only on the docker network).
# - Falls back to /index.html for client-side routing (Wouter).

upstream modulo_api {
    server api:5000;
}

server {
    listen 80;
    server_name _;

    # Reasonable defaults for an SPA + REST API combo.
    client_max_body_size 50m;     # accommodate rent-roll / competitive-survey uploads
    proxy_read_timeout 300s;       # pricing-job and AI calls can be slow
    proxy_send_timeout 300s;

    root /usr/share/nginx/html;
    index index.html;

    # ----- API + server-served static prefixes -----
    location /api/ {
        proxy_pass http://modulo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass through cookies for the session-based auth.
        proxy_set_header Connection "";
    }

    # Express mounts /attached_assets at server/routes.ts:320.
    location /attached_assets/ {
        proxy_pass http://modulo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Uploaded files (multer destination). Served by the API if/when needed.
    location /uploads/ {
        proxy_pass http://modulo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ----- SPA static assets with sensible caching -----
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----- SPA fallback: any unmatched route returns index.html -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
